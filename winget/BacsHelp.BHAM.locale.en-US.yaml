ShortDescription: Industrial Telemetry & Network Discovery Daemon for Building Automation and IoT (Modbus, BACnet, KNX, ARP).
Description: |
  BHAM (BACS Help Auto Mapper) is a stand-alone industrial discovery and diagnostics daemon designed for HVAC/BMS field engineers, system integrators, and energy managers.
  It enables ultra-fast Modbus RTU/TCP sweep, BACnet/IP discovery, KNXnet/IP scanning, passive RS485 Zero-TX bus sniffing, real-time Bus Health telemetry, and automated Excel/PDF commissioning reports.
