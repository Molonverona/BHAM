name: Release – Standalone Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo di avanzamento versione"
        type: choice
        required: true
        default: "patch"
        options:
          - "patch (es. 0.8.0 -> 0.8.1)"
          - "minor (es. 0.8.0 -> 0.9.0)"
          - "major (es. 0.8.0 -> 1.0.0)"
          - "custom"
      custom_version:
        description: "Versione personalizzata (solo se scelto custom, es. 0.8.5)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-version:
    name: Prepare Version & Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_version.outputs.release_tag }}
      clean_version: ${{ steps.set_version.outputs.clean_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Version & Tag
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_INPUT="${{ github.event.inputs.bump }}"
            CUSTOM_VER="${{ github.event.inputs.custom_version }}"

            if [[ "$BUMP_INPUT" == *"patch"* ]]; then
              BUMP_MODE="patch"
            elif [[ "$BUMP_INPUT" == *"minor"* ]]; then
              BUMP_MODE="minor"
            elif [[ "$BUMP_INPUT" == *"major"* ]]; then
              BUMP_MODE="major"
            else
              BUMP_MODE="$CUSTOM_VER"
            fi

            NEW_VER=$(python3 scripts/bump_version.py "$BUMP_MODE")
            TAG_NAME="v${NEW_VER}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $(python3 scripts/bump_version.py --files)
            git commit -m "chore(release): ${TAG_NAME} [skip ci]" || true
            git tag -a "$TAG_NAME" -m "Release ${TAG_NAME}"
            git push origin HEAD:main --tags

            echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "clean_version=${NEW_VER}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            CLEAN_VER="${TAG_NAME#v}"
            echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Standalone Windows x64
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.release_tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller bham.spec

      - name: Package Portable Windows Edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-portable
          Copy-Item dist\bham.exe dist-portable\
          New-Item -ItemType File -Path dist-portable\portable.flag
          Copy-Item README.md, MANUALE_UTENTE.md, LICENSE dist-portable\
          Compress-Archive -Path dist-portable\* -DestinationPath bham-windows-x64-portable.zip
          $hash = (Get-FileHash -Path bham-windows-x64-portable.zip -Algorithm SHA256).Hash
          Set-Content -Path bham-windows-x64-portable.zip.sha256 -Value $hash

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\bham.iss
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            Copy-Item $_.FullName .
            $hash = (Get-FileHash -Path $_.Name -Algorithm SHA256).Hash
            Set-Content -Path ($_.Name + ".sha256") -Value $hash
          }

      - name: Submit a Signing Request to SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || 'bham' }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'initial' }}
          input-artifact-path: bham-windows-x64-portable.zip
          output-artifact-path: bham-windows-x64-portable-signed.zip

      - name: Apply Signed Portable Zip
        if: ${{ hashFiles('bham-windows-x64-portable-signed.zip') != '' }}
        shell: pwsh
        run: |
          Move-Item -Force bham-windows-x64-portable-signed.zip bham-windows-x64-portable.zip
          $hash = (Get-FileHash -Path bham-windows-x64-portable.zip -Algorithm SHA256).Hash
          Set-Content -Path bham-windows-x64-portable.zip.sha256 -Value $hash
          Write-Host "✅ Binario firmato con successo da SignPath applicato alla release!"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            bham-windows-x64-portable.zip
            bham-windows-x64-portable.zip.sha256
            bham-windows-x64-installer-*.exe
            bham-windows-x64-installer-*.exe.sha256

  build-linux:
    name: Build Standalone Linux x64 (.tar.gz e .deb)
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.release_tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller bham.spec

      - name: Package Linux Binary (.tar.gz and .deb)
        run: |
          chmod +x dist/bham
          cp README.md MANUALE_UTENTE.md dist/
          tar -czvf bham-linux-x64.tar.gz -C dist bham README.md MANUALE_UTENTE.md
          sha256sum bham-linux-x64.tar.gz > bham-linux-x64.tar.gz.sha256

          # Costruzione pacchetto Debian/Ubuntu (.deb)
          VERSION="${{ needs.prepare-version.outputs.clean_version }}"
          chmod +x scripts/package_deb.sh
          ./scripts/package_deb.sh "$VERSION"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            bham-linux-x64.tar.gz
            bham-linux-x64.tar.gz.sha256
            bham_*.deb
            bham_*.deb.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code for Scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.release_tag }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${{ needs.prepare-version.outputs.clean_version }}"
          awk -v v="$VER" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "Release v${VER}" > release_notes.md
          fi
          cat release_notes.md

      - name: Build source/launcher bundle
        run: |
          VER="${{ needs.prepare-version.outputs.clean_version }}"
          git archive --format=zip --prefix="bham-${VER}/" -o "bham-source-${VER}.zip" HEAD
          sha256sum "bham-source-${VER}.zip" > "bham-source-${VER}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.prepare-version.outputs.release_tag }}
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          draft: false
          prerelease: ${{ contains(needs.prepare-version.outputs.release_tag, '-') }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            bham-source-*.zip
            bham-source-*.zip.sha256
            bham-windows-x64*.zip
            bham-windows-x64*.zip.sha256
            bham-windows-x64-installer-*.exe
            bham-windows-x64-installer-*.exe.sha256
            bham-linux-x64.tar.gz
            bham-linux-x64.tar.gz.sha256
            bham_*.deb
            bham_*.deb.sha256
            scripts/install.sh