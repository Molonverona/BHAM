[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bham"
version = "1.3.0"
description = "BACS Help Auto Mapper – Industrial discovery and diagnostics daemon for Building Automation systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "BHAM Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
    "python-multipart>=0.0.32",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymodbus>=3.16.1",
    "bacpypes3>=0.0.110",
    "pyserial>=3.5",
    "scapy>=2.8.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
    "aiofiles>=25.1.0",
    "python-dotenv>=1.2.4",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.0",
]

[project.scripts]
bham = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "data*", "reports*", "scanners*"]
exclude = ["tests*", "logs*", "sessions*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.png", "*.svg"]
