[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bham"
version = "0.8.0"
description = "BACS Help Auto Mapper – Industrial discovery and diagnostics daemon for Building Automation systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "BHAM Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "websockets>=13.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "pymodbus>=3.7.2",
    "bacpypes3>=0.0.102",
    "pyserial>=3.5",
    "scapy>=2.6.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.0",
]

[project.scripts]
bham = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "data*", "reports*", "scanners*"]
exclude = ["tests*", "logs*", "sessions*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.png", "*.svg"]
